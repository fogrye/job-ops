# Build the app image on every push to dev and publish it to the private
# zot registry at registry.kuvsh.pro. zot authenticates docker/login-action
# the normal Basic Auth way: username is your zot username, password is a
# zot API key (see "REGISTRY_USERNAME"/"REGISTRY_API_KEY" secrets below).
name: dev-image

on:
  push:
    branches: [dev]

concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.kuvsh.pro
        uses: docker/login-action@v3
        with:
          registry: registry.kuvsh.pro
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_API_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: registry.kuvsh.pro/job-ops-cv:latest
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
